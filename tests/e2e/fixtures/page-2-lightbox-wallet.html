<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Thank You Page (lightbox, digital wallet)</title>
    <script>
      window.pageJson = {
        pageType: "donation",
        pageNumber: 2,
        pageCount: 2,
        campaignPageId: 12345,
        clientId: 678,
      };
    </script>
  </head>
  <body>
    <div class="en__component">
      <h1>Thank you for your donation</h1>
    </div>
    <!-- With wallets the child sends "loaded" first and "enabled" only once
         the wallet UI appears (or "exit" when it never does) -->
    <regive
      amount="5,10"
      heading="Give again with your wallet"
      digital-wallets="true"
      test="true"
      test-method="stripedigitalwallet"
      lightbox="true"
    ></regive>
    <script src="/regive.js"></script>
  </body>
</html>
