<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Donation Page 1 (digital wallet)</title>
    <script>
      window.pageJson = {
        pageType: "donation",
        pageNumber: 1,
        pageCount: 2,
        campaignPageId: 12345,
        clientId: 678,
      };
    </script>
  </head>
  <body>
    <form
      class="en__component"
      action="/page/12345/donate/2?chain&amp;regive-amount=5%2C10"
      method="post"
    >
      <div class="en__component en__component--formblock">
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="text"
            name="supporter.firstName"
            value="Ada"
          />
        </div>
        <input type="hidden" name="transaction.paymenttype" value="" />
        <input type="hidden" name="supporter.appealCode" value="" />
        <input type="radio" name="transaction.donationAmt" value="5" />
        <input type="radio" name="transaction.donationAmt" value="10" />
        <input type="text" name="transaction.donationAmt.other" value="" />
        <input type="radio" name="transaction.recurrpay" value="N" checked />
        <input type="radio" name="transaction.recurrpay" value="Y" />
        <div id="wallet-slot"></div>
      </div>
      <div class="en__component en__submit">
        <button type="submit">Donate</button>
      </div>
    </form>
    <script>
      // The wallet UI renders late, as EN's Stripe buttons do. With ?nowallet
      // it never renders, so Regive times out and exits.
      if (!new URLSearchParams(location.search).has("nowallet")) {
        setTimeout(() => {
          const wallet = document.createElement("div");
          wallet.id = "en__digitalWallet";
          const walletFrame = document.createElement("iframe");
          walletFrame.title = "Mock wallet";
          walletFrame.src = "about:blank";
          wallet.appendChild(walletFrame);
          document.getElementById("wallet-slot").appendChild(wallet);
        }, 1000);
      }
    </script>
    <script src="/regive.js"></script>
  </body>
</html>
