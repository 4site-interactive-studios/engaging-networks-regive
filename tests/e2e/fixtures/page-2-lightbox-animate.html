<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Thank You Page (animated lightbox, test mode)</title>
    <script>
      window.pageJson = {
        pageType: "donation",
        pageNumber: 2,
        pageCount: 2,
        campaignPageId: 12345,
        clientId: 678,
      };
    </script>
  </head>
  <body>
    <button type="button" id="host-focus">Host page button</button>
    <!-- Built-in theme: the motions come from the defaults in the built-in
         template's CSS block -->
    <div class="en__component en__component--codeblock">
      <h1>Thank you for your donation</h1>
      <regive
        amount="7"
        heading="Give again"
        thank-you-message="You did it again!"
        test="true"
        lightbox="true"
        lightbox-animate="true"
      ></regive>
    </div>
    <div style="height: 3000px"></div>
    <script src="/regive.js"></script>
  </body>
</html>
