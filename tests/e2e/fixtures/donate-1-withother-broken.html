<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Donation Page 1 (broken "Other" markup variant)</title>
    <script>
      window.pageJson = {
        pageType: "donation",
        pageNumber: 1,
        pageCount: 2,
        campaignPageId: 12345,
        clientId: 678,
      };
    </script>
  </head>
  <body>
    <form class="en__component" action="/echo" method="post">
      <div class="en__component en__component--formblock">
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="text"
            name="supporter.firstName"
            value="Ada"
          />
        </div>
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="email"
            name="supporter.emailAddress"
            value="ada@example.org"
          />
        </div>
        <input type="hidden" name="transaction.paymenttype" value="" />
        <input type="hidden" name="supporter.appealCode" value="" />
        <input type="hidden" name="transaction.ccnumber" value="" />
        <input type="hidden" name="transaction.ccvv" value="" />
        <input type="hidden" name="transaction.ccexpire" value="" />
        <input type="hidden" name="transaction.vgs.cardType" value="" />
        <!-- Markup variant where the second-to-last field item holds a
             non-radio input named transaction.donationAmt (disabled, so the
             amount cannot be applied through it). Regive's other-amount
             fallback selector matches this input, but checking it is a
             no-op - the component must exit rather than submit the stale
             $5 selection alongside the "other" amount. -->
        <div
          class="en__field en__field--radio en__field--donationAmt en__field--withOther"
        >
          <div class="en__field__element en__field__element--radio">
            <div class="en__field__item">
              <input
                type="radio"
                name="transaction.donationAmt"
                value="5.00"
                checked
              />
            </div>
            <div class="en__field__item">
              <input
                type="radio"
                name="transaction.donationAmt"
                value="10.00"
              />
            </div>
            <div class="en__field__item">
              <input
                type="text"
                name="transaction.donationAmt"
                value=""
                disabled
              />
            </div>
            <div class="en__field__item en__field__item--other">
              <input
                type="text"
                name="transaction.donationAmt.other"
                value=""
              />
            </div>
          </div>
        </div>
        <input type="radio" name="transaction.recurrpay" value="N" checked />
        <input type="radio" name="transaction.recurrpay" value="Y" />
        <select name="transaction.recurrfreq">
          <option value="ONETIME">One-time</option>
          <option value="MONTHLY">Monthly</option>
          <option value="ANNUAL">Annual</option>
        </select>
      </div>
      <div class="en__component en__submit">
        <button type="submit">Donate</button>
      </div>
    </form>
    <script src="/regive.js"></script>
  </body>
</html>
