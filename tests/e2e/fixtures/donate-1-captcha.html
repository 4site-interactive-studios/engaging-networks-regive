<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Donation Page 1 (reCAPTCHA)</title>
    <script>
      window.pageJson = {
        pageType: "donation",
        pageNumber: 1,
        pageCount: 2,
        campaignPageId: 12345,
        clientId: 678,
      };
      // Mock reCAPTCHA callbacks. Regive wraps them by name, so tests fire
      // window.captchaVerified() the way the real widget does. With
      // ?nocallback the callback is missing and Regive must exit.
      if (!new URLSearchParams(location.search).has("nocallback")) {
        window.captchaVerified = () => {};
      }
      window.captchaExpired = () => {};
    </script>
  </head>
  <body>
    <form
      class="en__component"
      action="/page/12345/donate/2?chain&amp;regive-amount=5%2C10"
      method="post"
    >
      <div class="en__component en__component--formblock">
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="text"
            name="supporter.firstName"
            value="Ada"
          />
        </div>
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="email"
            name="supporter.emailAddress"
            value="ada@example.org"
          />
        </div>
        <input type="hidden" name="transaction.paymenttype" value="" />
        <input type="hidden" name="supporter.appealCode" value="" />
        <input type="hidden" name="transaction.ccnumber" value="" />
        <input type="hidden" name="transaction.ccvv" value="" />
        <input type="hidden" name="transaction.ccexpire" value="" />
        <input type="hidden" name="transaction.vgs.cardType" value="" />
        <input type="radio" name="transaction.donationAmt" value="5" />
        <input type="radio" name="transaction.donationAmt" value="10" />
        <input type="text" name="transaction.donationAmt.other" value="" />
        <input type="radio" name="transaction.recurrpay" value="N" checked />
        <input type="radio" name="transaction.recurrpay" value="Y" />
        <select name="transaction.recurrfreq">
          <option value="ONETIME">One-time</option>
          <option value="MONTHLY">Monthly</option>
        </select>
        <div class="en__field en__field--captcha">
          <div class="en__captcha">
            <div
              class="g-recaptcha"
              data-callback="captchaVerified"
              data-expired-callback="captchaExpired"
            >
              Mock reCAPTCHA
            </div>
          </div>
        </div>
      </div>
      <div class="en__component en__submit">
        <button type="submit">Donate</button>
      </div>
    </form>
    <script src="/regive.js"></script>
  </body>
</html>
