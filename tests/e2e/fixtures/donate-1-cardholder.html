<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Donation Page 1 (CC payment type with card holder name)</title>
    <script>
      window.pageJson = {
        pageType: "donation",
        pageNumber: 1,
        pageCount: 2,
        campaignPageId: 12345,
        clientId: 678,
      };
    </script>
  </head>
  <body>
    <!-- Posts to /echo so tests can assert the submitted field values -->
    <form class="en__component" action="/echo" method="post">
      <div class="en__component en__component--formblock">
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="text"
            name="supporter.firstName"
            value="Ada"
          />
        </div>
        <div class="en__field en__mandatory">
          <input
            class="en__field__input"
            type="email"
            name="supporter.emailAddress"
            value="ada@example.org"
          />
        </div>
        <!-- A single unchecked "Pay with Credit Card" radio valued "CC" -->
        <div class="en__field en__field--paymenttype en__mandatory">
          <input
            type="radio"
            name="transaction.paymenttype"
            value="CC"
          />
        </div>
        <input type="hidden" name="supporter.appealCode" value="" />
        <input type="radio" name="transaction.donationAmt" value="5" />
        <input type="radio" name="transaction.donationAmt" value="10" />
        <input type="text" name="transaction.donationAmt.other" value="" />
        <input type="radio" name="transaction.recurrpay" value="N" checked />
        <input type="radio" name="transaction.recurrpay" value="Y" />
        <select name="transaction.recurrfreq">
          <option value="ONETIME">One-time</option>
          <option value="MONTHLY">Monthly</option>
        </select>
      </div>
      <!-- Card section: hidden and disabled by EN's conditional rules until
           the "CC" payment type radio is checked. The card holder name is
           mandatory and, like on EN, not pre-filled on the chained page. -->
      <div class="en__component en__component--formblock card-block">
        <div class="en__field en__field--creditCardHolderName en__mandatory en__hidden">
          <input
            class="en__field__input"
            type="text"
            name="supporter.creditCardHolderName"
            value=""
            disabled
          />
        </div>
        <div class="en__field en__field--ccnumber en__mandatory en__hidden">
          <input type="hidden" name="transaction.ccnumber" value="" disabled />
        </div>
        <div class="en__field en__field--ccvv en__mandatory en__hidden">
          <input type="hidden" name="transaction.ccvv" value="" disabled />
        </div>
        <div class="en__field en__field--ccexpire en__mandatory en__hidden">
          <input type="hidden" name="transaction.ccexpire" value="" disabled />
        </div>
      </div>
      <div class="en__component en__submit">
        <button type="submit">Donate</button>
      </div>
    </form>
    <script>
      // Stand-in for EN's conditional content: checking the "CC" radio reveals
      // and enables the card section
      document
        .querySelector('input[name="transaction.paymenttype"]')
        .addEventListener("change", (event) => {
          if (!event.target.checked) return;
          document.querySelectorAll(".card-block .en__field").forEach((field) => {
            field.classList.remove("en__hidden");
            field
              .querySelectorAll("input")
              .forEach((input) => (input.disabled = false));
          });
        });
    </script>
    <script src="/regive.js"></script>
  </body>
</html>
